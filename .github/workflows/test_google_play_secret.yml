name: Test Google Play Secret

on:
  workflow_dispatch:

jobs:
  validate-google-play-secret:
    name: Validate Google Play service account JSON
    runs-on: ubuntu-latest

    steps:
      - name: Validate GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "")

          print("Secret length:", len(raw))

          if not raw.strip():
              raise SystemExit("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON: {e}")

          print("type:", data.get("type"))
          print("project_id:", data.get("project_id"))
          print("client_email:", data.get("client_email"))
          print("has private_key:", bool(data.get("private_key")))

          if data.get("type") != "service_account":
              raise SystemExit("Expected type=service_account")
          if not data.get("client_email"):
              raise SystemExit("Missing client_email")
          if not data.get("private_key"):
              raise SystemExit("Missing private_key")

          path = Path("/tmp/google-play-service-account.json")
          path.write_text(raw)
          json.loads(path.read_text())

          print("OK: Google Play service account secret is valid")
          PY
          